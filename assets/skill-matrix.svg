<svg width="700" height="576" viewBox="0 0 700 576" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    * { font-family: 'Courier New', Courier, monospace; }
    @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes blink   { 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
    @keyframes pulse   { 0%,100%{opacity:1;} 50%{opacity:0.35;} }
    @keyframes b0 { to { stroke-dashoffset: 51.0; } }
    @keyframes b1 { to { stroke-dashoffset: 95.2; } }
    @keyframes b2 { to { stroke-dashoffset: 119.0; } }
    @keyframes b3 { to { stroke-dashoffset: 102.0; } }
    @keyframes b4 { to { stroke-dashoffset: 68.0; } }
    @keyframes b5 { to { stroke-dashoffset: 85.0; } }
    @keyframes b6 { to { stroke-dashoffset: 136.0; } }
    @keyframes b7 { to { stroke-dashoffset: 108.8; } }
    @keyframes b8 { to { stroke-dashoffset: 51.0; } }
    @keyframes b9 { to { stroke-dashoffset: 61.2; } }
    @keyframes b10 { to { stroke-dashoffset: 74.8; } }
    @keyframes b11 { to { stroke-dashoffset: 95.2; } }
    @keyframes b12 { to { stroke-dashoffset: 74.8; } }
    @keyframes b13 { to { stroke-dashoffset: 108.8; } }
    .t0  { animation: fadeIn .45s 0.20s both; }
    .b0  { animation: fadeIn .45s 0.20s both, b0 1.3s 0.35s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t1  { animation: fadeIn .45s 0.33s both; }
    .b1  { animation: fadeIn .45s 0.33s both, b1 1.3s 0.48s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t2  { animation: fadeIn .45s 0.46s both; }
    .b2  { animation: fadeIn .45s 0.46s both, b2 1.3s 0.61s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t3  { animation: fadeIn .45s 0.59s both; }
    .b3  { animation: fadeIn .45s 0.59s both, b3 1.3s 0.74s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t4  { animation: fadeIn .45s 0.72s both; }
    .b4  { animation: fadeIn .45s 0.72s both, b4 1.3s 0.87s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t5  { animation: fadeIn .45s 0.85s both; }
    .b5  { animation: fadeIn .45s 0.85s both, b5 1.3s 1.00s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t6  { animation: fadeIn .45s 0.98s both; }
    .b6  { animation: fadeIn .45s 0.98s both, b6 1.3s 1.13s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t7  { animation: fadeIn .45s 1.11s both; }
    .b7  { animation: fadeIn .45s 1.11s both, b7 1.3s 1.26s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t8  { animation: fadeIn .45s 1.24s both; }
    .b8  { animation: fadeIn .45s 1.24s both, b8 1.3s 1.39s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t9  { animation: fadeIn .45s 1.37s both; }
    .b9  { animation: fadeIn .45s 1.37s both, b9 1.3s 1.52s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t10  { animation: fadeIn .45s 1.50s both; }
    .b10  { animation: fadeIn .45s 1.50s both, b10 1.3s 1.65s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t11  { animation: fadeIn .45s 1.63s both; }
    .b11  { animation: fadeIn .45s 1.63s both, b11 1.3s 1.78s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t12  { animation: fadeIn .45s 1.76s both; }
    .b12  { animation: fadeIn .45s 1.76s both, b12 1.3s 1.91s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .t13  { animation: fadeIn .45s 1.89s both; }
    .b13  { animation: fadeIn .45s 1.89s both, b13 1.3s 2.04s cubic-bezier(.22,1,.36,1) forwards; stroke-dashoffset:340; }
    .sh0 { animation: fadeIn .5s 0.10s both; }
    .sh1 { animation: fadeIn .5s 0.40s both; }
    .sh2 { animation: fadeIn .5s 0.71s both; }
    .cursor { animation: blink 1.1s infinite; }
    .dot    { animation: pulse 2.2s 1s infinite; }
    .hdr    { animation: fadeIn .5s .05s both; }
